{% extends "base.html" %}

{% block title %}Set Your Password — Classroom Pulse{% endblock %}
{% block page_title %}Set Your Password{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm">
  <div class="rounded-2xl border border-white/60 bg-white/80 shadow-md backdrop-blur-sm ring-1 ring-slate-900/5 overflow-hidden">
    <div class="border-b border-slate-100 bg-gradient-to-r from-indigo-50 to-white px-6 py-4">
      <p class="text-sm font-semibold text-slate-800">Welcome to Classroom Pulse</p>
      <p class="mt-0.5 text-xs text-slate-400">Your account was set up by an admin. Please choose a new password to continue.</p>
    </div>
    <form method="POST" class="px-6 py-5 space-y-4">
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold uppercase tracking-wide text-slate-400">New password</label>
        <input type="password" name="password" required autocomplete="new-password" minlength="6"
               class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700 shadow-sm
                      focus:border-indigo-400 focus:outline-none focus:ring-1 focus:ring-indigo-300 transition">
      </div>
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold uppercase tracking-wide text-slate-400">Confirm password</label>
        <input type="password" name="password2" required autocomplete="new-password" minlength="6"
               class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700 shadow-sm
                      focus:border-indigo-400 focus:outline-none focus:ring-1 focus:ring-indigo-300 transition">
      </div>
      <button type="submit"
              class="w-full rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm
                     hover:bg-indigo-500 transition-colors">
        Set Password &amp; Continue
      </button>
    </form>
  </div>
</div>
{% endblock %}
